name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/web.test.cjs
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc macos/Source/Analysis.swift macos/Source/Localization.swift macos/Tests/main.swift -o /tmp/chatcount-tests
      - run: /tmp/chatcount-tests
